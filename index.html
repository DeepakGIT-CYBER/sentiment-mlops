<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sentiment Analysis</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            min-height: 100vh;
            background: linear-gradient(135deg, #ff416c, #ff4b2b);
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 40px 20px;
        }

        .container {
            width: 100%;
            max-width: 840px;
            background: #fffafa;
            border-radius: 28px;
            padding: 35px 38px 45px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.18);
        }

        h1 {
            text-align: center;
            margin: 0 0 8px;
            font-size: 36px;
            color: #222;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 28px;
            font-size: 17px;
        }

        textarea {
            width: 100%;
            min-height: 130px;
            resize: vertical;
            border: 2px solid #ddd;
            border-radius: 18px;
            padding: 18px;
            font-size: 18px;
            outline: none;
            font-family: inherit;
        }

        textarea:focus {
            border-color: #667eea;
        }

        .button-area {
            text-align: center;
            margin: 25px 0;
        }

        button {
            background: #667eea;
            color: white;
            border: none;
            border-radius: 35px;
            padding: 16px 55px;
            font-size: 22px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #5568d8;
        }

        .result {
            text-align: center;
            margin-top: 25px;
        }

        .emoji {
            font-size: 80px;
            margin-bottom: 8px;
        }

        .sentiment {
            font-size: 40px;
            font-weight: bold;
            margin-bottom: 12px;
        }

        .polarity {
            font-size: 21px;
            color: #555;
            margin-bottom: 28px;
        }

        .meter {
            width: 100%;
            height: 28px;
            border-radius: 20px;
            background: linear-gradient(
                to right,
                #ff3b30 0%,
                #ffcc00 40%,
                #d9d9d9 50%,
                #66bb6a 60%,
                #22c55e 100%
            );
            position: relative;
            overflow: hidden;
            margin-bottom: 10px;
        }

        .meter-marker {
            position: absolute;
            top: 0;
            width: 5px;
            height: 100%;
            background: #111;
            border-radius: 5px;
            transform: translateX(-50%);
        }

        .labels {
            display: flex;
            justify-content: space-between;
            font-size: 17px;
            color: #555;
            margin-bottom: 30px;
        }

        .history-title {
            font-size: 25px;
            font-weight: bold;
            margin-bottom: 15px;
            color: #222;
        }

        .history-item {
            padding: 15px 18px;
            border-radius: 15px;
            margin-bottom: 10px;
            font-size: 18px;
            line-height: 1.4;
        }

        .history-positive {
            background: #e8f8ea;
            border-left: 7px solid #22c55e;
        }

        .history-neutral {
            background: #fff7df;
            border-left: 7px solid #f0ad00;
        }

        .history-negative {
            background: #ffe8e8;
            border-left: 7px solid #ef4444;
        }

        .positive {
            color: #16a34a;
        }

        .neutral {
            color: #d18b00;
        }

        .negative {
            color: #dc2626;
        }

        .error {
            color: #dc2626;
            text-align: center;
            font-weight: bold;
            margin-top: 15px;
        }

        @media (max-width: 600px) {
            .container {
                padding: 25px 20px 35px;
            }

            h1 {
                font-size: 28px;
            }

            .sentiment {
                font-size: 32px;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <h1>Sentiment Analysis</h1>

    <div class="subtitle">
        Analyze your text using Natural Language Processing
    </div>

    <textarea id="textInput"
        placeholder="Enter your sentence here..."></textarea>

    <div class="button-area">
        <button onclick="analyzeSentiment()">Analyze</button>
    </div>

    <div id="result" class="result"></div>

    <div class="history-title">
        Analysis History
    </div>

    <div id="history"></div>

</div>

<script>

    const history = [];

    async function analyzeSentiment() {

        const text = document.getElementById("textInput").value.trim();
        const result = document.getElementById("result");

        if (!text) {
            result.innerHTML =
                '<div class="error">Please enter some text first.</div>';
            return;
        }

        result.innerHTML = "<div>Analyzing...</div>";

        try {

            const response = await fetch("/predict", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    text: text
                })
            });

            if (!response.ok) {
                throw new Error("Server error");
            }

            const data = await response.json();

            /*
             IMPORTANT:
             We use the BACKEND sentiment label directly.
             This keeps Positive, Neutral and Negative
             perfectly synchronized with app.py.
            */

            const sentiment = data.sentiment;
            const polarity = data.polarity;

            let emoji = "";
            let sentimentClass = "";

            if (sentiment === "Positive") {

                emoji = "😊";
                sentimentClass = "positive";

            } else if (sentiment === "Negative") {

                emoji = "😡";
                sentimentClass = "negative";

            } else {

                emoji = "😐";
                sentimentClass = "neutral";

            }

            result.innerHTML = `
                <div class="emoji">${emoji}</div>

                <div class="sentiment ${sentimentClass}">
                    ${sentiment}
                </div>

                <div class="polarity">
                    Polarity Score:
                    <strong>${polarity.toFixed(3)}</strong>
                </div>

                <div class="meter">
                    <div
                        class="meter-marker"
                        style="left: ${((polarity + 1) / 2) * 100}%">
                    </div>
                </div>

                <div class="labels">
                    <span>😡 Negative</span>
                    <span>😐 Neutral</span>
                    <span>😊 Positive</span>
                </div>
            `;

            history.unshift({
                text: text,
                sentiment: sentiment,
                polarity: polarity
            });

            showHistory();

        } catch (error) {

            result.innerHTML =
                '<div class="error">Unable to connect to the sentiment analysis server.</div>';

        }
    }


    function showHistory() {

        const historyDiv = document.getElementById("history");

        historyDiv.innerHTML = "";

        history.forEach(item => {

            let emoji = "";
            let historyClass = "";

            if (item.sentiment === "Positive") {

                emoji = "😊";
                historyClass = "history-positive";

            } else if (item.sentiment === "Negative") {

                emoji = "😡";
                historyClass = "history-negative";

            } else {

                emoji = "😐";
                historyClass = "history-neutral";

            }

            const div = document.createElement("div");

            div.className = `history-item ${historyClass}`;

            div.innerHTML = `
                ${emoji}
                <strong>${item.sentiment}</strong>
                — "${escapeHtml(item.text)}"
                — ${item.polarity.toFixed(3)}
            `;

            historyDiv.appendChild(div);

        });
    }


    function escapeHtml(text) {

        const div = document.createElement("div");

        div.textContent = text;

        return div.innerHTML;
    }

</script>

</body>
</html>
